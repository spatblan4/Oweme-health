[project]
name = "oweme-worker"
version = "0.1.0"
description = "Python worker for OweMe Health file processing"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.5",
  "pdfplumber>=0.11.4",
  "pdf2image>=1.17.0",
  "pypdf>=5.1.0",
  "Pillow>=10.4.0",
  "xlrd>=2.0.1",
  "psycopg[binary]>=3.2.3",
  "python-dotenv>=1.0.1",
  "pytest>=8.3.4",
  "supabase>=2.10.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
